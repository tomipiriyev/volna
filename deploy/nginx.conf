# Sample nginx server block for the static build in dist/.
server {
    listen 443 ssl http2;
    server_name antenna-sim.example;
    root /srv/antenna-sim/dist;

    # Cross-origin isolation (SharedArrayBuffer for the multi-threaded solver).
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    types { application/wasm wasm; }
    include /etc/nginx/mime.types;
    gzip on;
    gzip_types application/javascript application/wasm text/css;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
